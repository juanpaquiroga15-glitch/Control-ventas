<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macOS Business HUD - Control y Stock</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --mac-window-bg: rgba(30, 30, 35, 0.85);
      --mac-border: rgba(255, 255, 255, 0.12);
      --mac-text: #f5f5f7;
      --mac-text-muted: #98989d;
      --mac-accent: #0a84ff;
      --mac-success: #32d74b;
      --mac-red: #ff453a;
      --mac-whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    
    body { 
      background-color: #0d0d12;
      background-image: radial-gradient(circle at 30% 20%, #2b1055 0%, #7597de 0%, #111425 100%), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      color: var(--mac-text); 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }

    /* BARRA DE MENÚ SUPERIOR */
    .menu-bar {
      height: 28px;
      background: rgba(20, 20, 25, 0.65);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--mac-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 0.8rem;
      font-weight: 500;
      z-index: 1000;
    }
    .menu-left, .menu-right { display: flex; align-items: center; gap: 16px; }
    .menu-item { cursor: pointer; transition: opacity 0.2s; }
    .menu-item:hover { opacity: 0.8; }

    /* ESCRITORIO */
    .desktop {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* VENTANAS MACOS */
    .mac-window {
      position: absolute;
      width: 580px;
      height: 480px;
      background: var(--mac-window-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--mac-border);
      border-radius: 12px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      display: none;
      z-index: 10;
      overflow: hidden;
      transition: top 0.25s ease, left 0.25s ease, width 0.25s ease, height 0.25s ease, border-radius 0.25s ease;
    }
    .mac-window.active { display: flex; }

    /* ESTADO DE PANTALLA COMPLETA DE VENTANA */
    .mac-window.fullscreen {
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: calc(100vh - 28px) !important;
      border-radius: 0 !important;
      border: none;
    }

    /* BARRA DE TÍTULO */
    .window-header {
      height: 38px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--mac-border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      position: relative;
      cursor: grab;
      user-select: none;
    }
    .mac-window.fullscreen .window-header { cursor: default; }
    .window-header:active { cursor: grabbing; }
    .window-controls { display: flex; gap: 8px; z-index: 5; }
    .control-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: none; }
    .btn-close { background: #ff5f56; }
    .btn-minimize { background: #ffbd2e; }
    .btn-maximize { background: #27c93f; }
    .window-title { 
      position: absolute; 
      width: 100%;
      text-align: center;
      left: 0;
      font-size: 0.8rem; 
      font-weight: 600; 
      color: var(--mac-text-muted); 
      pointer-events: none; 
    }

    .window-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mac-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--mac-border);
      border-radius: 10px;
      padding: 14px;
    }
    .mac-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--mac-border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--mac-text);
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 8px;
    }
    .mac-input:focus { border-color: var(--mac-accent); }
    .mac-btn {
      background: var(--mac-accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .mac-btn:hover { opacity: 0.85; }

    .list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--mac-border);
      font-size: 0.85rem;
    }
    .list-row:last-child { border-bottom: none; }

    /* BOTONES DE ACCIÓN PARA CLIENTES */
    .client-actions {
      display: flex;
      gap: 6px;
    }
    .client-action-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    .client-action-btn:hover { opacity: 0.85; transform: scale(1.05); }
    .btn-wa { background: var(--mac-whatsapp); }
    .btn-call { background: var(--mac-success); }
    .btn-maps { background: var(--mac-accent); }

    /* DOCK INFERIOR */
    .dock-container {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(25px);
      border: 1px solid var(--mac-border);
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      gap: 12px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .dock-app {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
    }
    .dock-app:hover { transform: scale(1.25) translateY(-6px); }
    .dock-dot {
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      bottom: -4px;
      display: none;
    }
    .dock-app.open .dock-dot { display: block; }
  </style>
</head>
<body>

  <div class="menu-bar">
    <div class="menu-left">
      <span class="menu-item"><i class="fa-brands fa-apple"></i></span>
      <span class="menu-item" style="font-weight: 700;">macOS HUD</span>
    </div>
    <div class="menu-right">
      <span class="menu-item"><i class="fa-solid fa-wifi"></i></span>
      <span class="menu-item" id="relojMac">00:00</span>
    </div>
  </div>

  <div class="desktop" id="desktop">

    <!-- VENTANA 1: STOCK -->
    <div class="mac-window active" id="win-stock" style="top: 50px; left: 50px;" onmousedown="enfocarVentana('stock')">
      <div class="window-header" onmousedown="iniciarArrastre(event, 'win-stock')">
        <div class="window-controls">
          <button class="control-btn btn-close" onclick="cerrarVentana(event, 'stock')"></button>
          <button class="control-btn btn-minimize"></button>
          <button class="control-btn btn-maximize" onclick="togglePantallaCompleta(event, 'stock')"></button>
        </div>
        <span class="window-title">Control de Stock - Inventario</span>
      </div>
      <div class="window-body">
        <div class="mac-box">
          <input type="text" id="nombreProducto" class="mac-input" placeholder="Nombre del producto">
          <input type="number" id="stockProducto" class="mac-input" placeholder="Cantidad en stock">
          <div style="display: flex; gap: 8px;">
            <input type="number" id="costoProducto" class="mac-input" placeholder="Precio de costo ($)">
            <input type="number" id="precioProducto" class="mac-input" placeholder="Precio de venta ($)">
          </div>
          <button class="mac-btn" onclick="agregarProducto()">Añadir al Inventario</button>
        </div>
        <div class="mac-box" style="flex: 1;">
          <h4 style="font-size: 0.8rem; color: var(--mac-text-muted); margin-bottom: 6px; text-transform: uppercase;">Productos Registrados</h4>
          <div id="listaStock"></div>
        </div>
      </div>
    </div>

    <!-- VENTANA 2: CLIENTES -->
    <div class="mac-window" id="win-clientes" style="top: 90px; left: 130px;" onmousedown="enfocarVentana('clientes')">
      <div class="window-header" onmousedown="iniciarArrastre(event, 'win-clientes')">
        <div class="window-controls">
          <button class="control-btn btn-close" onclick="cerrarVentana(event, 'clientes')"></button>
          <button class="control-btn btn-minimize"></button>
          <button class="control-btn btn-maximize" onclick="togglePantallaCompleta(event, 'clientes')"></button>
        </div>
        <span class="window-title">Directorio de Clientes</span>
      </div>
      <div class="window-body">
        <div class="mac-box">
          <input type="text" id="nombreCliente" class="mac-input" placeholder="Nombre completo">
          <input type="text" id="telCliente" class="mac-input" placeholder="Teléfono / Contacto">
          <input type="text" id="dirCliente" class="mac-input" placeholder="Dirección completa">
          <button class="mac-btn" onclick="agregarCliente()">Registrar Cliente</button>
        </div>
        <div class="mac-box" style="flex: 1;">
          <h4 style="font-size: 0.8rem; color: var(--mac-text-muted); margin-bottom: 6px; text-transform: uppercase;">Clientes Activos</h4>
          <div id="listaClientes"></div>
        </div>
      </div>
    </div>

    <!-- VENTANA 3: CUENTAS -->
    <div class="mac-window" id="win-cuentas" style="top: 130px; left: 210px;" onmousedown="enfocarVentana('cuentas')">
      <div class="window-header" onmousedown="iniciarArrastre(event, 'win-cuentas')">
        <div class="window-controls">
          <button class="control-btn btn-close" onclick="cerrarVentana(event, 'cuentas')"></button>
          <button class="control-btn btn-minimize"></button>
          <button class="control-btn btn-maximize" onclick="togglePantallaCompleta(event, 'cuentas')"></button>
        </div>
        <span class="window-title">Cuentas y Finanzas (Automático)</span>
      </div>
      <div class="window-body">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="mac-box">
            <span style="font-size: 0.7rem; color: var(--mac-text-muted); text-transform: uppercase;">Proyección Venta Total</span>
            <h3 id="totalVentaProyectada" style="font-size: 1.2rem; color: var(--mac-accent);">$0.00</h3>
          </div>
          <div class="mac-box">
            <span style="font-size: 0.7rem; color: var(--mac-text-muted); text-transform: uppercase;">Ganancia Potencial</span>
            <h3 id="totalGananciaPotencial" style="font-size: 1.2rem; color: var(--mac-success);">$0.00</h3>
          </div>
        </div>
        <div class="mac-box" style="flex: 1;">
          <h4 style="font-size: 0.8rem; color: var(--mac-text-muted); margin-bottom: 6px; text-transform: uppercase;">Resumen Automático por Producto</h4>
          <div id="listaCuentas"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="dock-container">
    <div class="dock-app open" id="dock-stock" style="background: linear-gradient(135deg, #ff9f0a, #ff453a);" onclick="toggleVentana('stock')" title="Stock">
      <i class="fa-solid fa-boxes-stacked"></i>
      <div class="dock-dot"></div>
    </div>
    <div class="dock-app" id="dock-clientes" style="background: linear-gradient(135deg, #0a84ff, #5856d6);" onclick="toggleVentana('clientes')" title="Clientes">
      <i class="fa-solid fa-users"></i>
      <div class="dock-dot"></div>
    </div>
    <div class="dock-app" id="dock-cuentas" style="background: linear-gradient(135deg, #32d74b, #30b0c7);" onclick="toggleVentana('cuentas')" title="Cuentas">
      <i class="fa-solid fa-wallet"></i>
      <div class="dock-dot"></div>
    </div>
  </div>

  <script>
    function actualizarReloj() {
      const ahora = new Date();
      let horas = ahora.getHours();
      let minutos = ahora.getMinutes();
      minutos = minutos < 10 ? '0' + minutos : minutos;
      document.getElementById('relojMac').innerText = `${horas}:${minutos}`;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    let maxZIndex = 100;
    function enfocarVentana(nombre) {
      const win = document.getElementById(`win-${nombre}`);
      maxZIndex++;
      win.style.zIndex = maxZIndex;
    }

    function toggleVentana(nombre) {
      const win = document.getElementById(`win-${nombre}`);
      const dock = document.getElementById(`dock-${nombre}`);
      if(win.classList.contains('active')) {
        win.classList.remove('active');
        dock.classList.remove('open');
      } else {
        win.classList.add('active');
        dock.classList.add('open');
        enfocarVentana(nombre);
      }
    }

    function cerrarVentana(event, nombre) {
      event.stopPropagation();
      document.getElementById(`win-${nombre}`).classList.remove('active');
      document.getElementById(`dock-${nombre}`).classList.remove('open');
    }

    function togglePantallaCompleta(event, nombre) {
      event.stopPropagation();
      const win = document.getElementById(`win-${nombre}`);
      win.classList.toggle('fullscreen');
      enfocarVentana(nombre);
    }

    // Sistema de Arrastre Libre Directo
    let ventanaActiva = null;
    let offsetX = 0, offsetY = 0;

    function iniciarArrastre(e, idVentana) {
      if(e.target.classList.contains('control-btn')) return;
      const win = document.getElementById(idVentana);
      if(win.classList.contains('fullscreen')) return;

      ventanaActiva = win;
      enfocarVentana(idVentana.replace('win-', ''));

      offsetX = e.clientX - ventanaActiva.offsetLeft;
      offsetY = e.clientY - ventanaActiva.offsetTop;

      document.addEventListener('mousemove', arrastrarVentana);
      document.addEventListener('mouseup', detenerArrastre);
      e.preventDefault();
    }

    function arrastrarVentana(e) {
      if(!ventanaActiva) return;
      let x = e.clientX - offsetX;
      let y = e.clientY - offsetY;
      if(y < 28) y = 28;
      ventanaActiva.style.left = x + 'px';
      ventanaActiva.style.top = y + 'px';
    }

    function detenerArrastre() {
      ventanaActiva = null;
      document.removeEventListener('mousemove', arrastrarVentana);
      document.removeEventListener('mouseup', detenerArrastre);
    }

    // Datos y LocalStorage
    let stock = JSON.parse(localStorage.getItem('mac_stock')) || [];
    let clientes = JSON.parse(localStorage.getItem('mac_clientes')) || [];

    function sincronizar() {
      localStorage.setItem('mac_stock', JSON.stringify(stock));
      localStorage.setItem('mac_clientes', JSON.stringify(clientes));
      renderizarTodo();
    }

    function agregarProducto() {
      const nombre = document.getElementById('nombreProducto').value;
      const cantidad = parseInt(document.getElementById('stockProducto').value);
      const costo = parseFloat(document.getElementById('costoProducto').value);
      const precio = parseFloat(document.getElementById('precioProducto').value);
      
      if(!nombre || isNaN(cantidad) || isNaN(costo) || isNaN(precio)) return alert('Completa todos los campos del producto con valores válidos.');
      
      stock.push({ nombre, cantidad, costo, precio });
      
      document.getElementById('nombreProducto').value = '';
      document.getElementById('stockProducto').value = '';
      document.getElementById('costoProducto').value = '';
      document.getElementById('precioProducto').value = '';
      sincronizar();
    }

    function renderStock() {
      const contenedor = document.getElementById('listaStock');
      if(stock.length === 0) { contenedor.innerHTML = '<span style="font-size:0.8rem; color:var(--mac-text-muted);">Sin stock registrado.</span>'; return; }
      
      contenedor.innerHTML = stock.map(p => {
        const gananciaUnit = (p.precio - p.costo).toFixed(2);
        return `
          <div class="list-row" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
              <strong>${p.nombre}</strong>
              <span style="color:var(--mac-success); font-weight:600;">Venta: $${p.precio}</span>
            </div>
            <div style="display: flex; justify-content: space-between; width: 100%; font-size: 0.75rem; color: var(--mac-text-muted);">
              <span>Stock: ${p.cantidad} | Costo: $${p.costo}</span>
              <span style="color: #5856d6;">Ganancia/u: $${gananciaUnit}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function agregarCliente() {
      const nombre = document.getElementById('nombreCliente').value;
      const tel = document.getElementById('telCliente').value;
      const dir = document.getElementById('dirCliente').value;
      if(!nombre || !tel || !dir) return alert('Completa todos los datos del cliente.');
      clientes.push({ nombre, tel, dir });
      document.getElementById('nombreCliente').value = '';
      document.getElementById('telCliente').value = '';
      document.getElementById('dirCliente').value = '';
      sincronizar();
    }

    function renderClientes() {
      const contenedor = document.getElementById('listaClientes');
      if(clientes.length === 0) { contenedor.innerHTML = '<span style="font-size:0.8rem; color:var(--mac-text-muted);">Sin clientes registrados.</span>'; return; }
      
      contenedor.innerHTML = clientes.map(c => {
        const cleanTel = c.tel.replace(/\D/g, '');
        const waUrl = `https://wa.me/${cleanTel}`;
        const callUrl = `tel:${c.tel}`;
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.dir)}`;
        
        return `
          <div class="list-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
              <div>
                <strong>${c.nombre}</strong><br>
                <small style="color:var(--mac-text-muted);"><i class="fa-solid fa-phone"></i> ${c.tel}</small>
              </div>
              <div class="client-actions">
                <a href="${waUrl}" target="_blank" class="client-action-btn btn-wa" title="Enviar WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="${callUrl}" class="client-action-btn btn-call" title="Llamar por teléfono"><i class="fa-solid fa-phone"></i></a>
                <a href="${mapsUrl}" target="_blank" class="client-action-btn btn-maps" title="Ver dirección en Google Maps"><i class="fa-solid fa-map-location-dot"></i></a>
              </div>
            </div>
            <div style="font-size: 0.75rem; color: var(--mac-text-muted);">
              <i class="fa-solid fa-location-dot" style="color: var(--mac-accent);"></i> ${c.dir}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCuentas() {
      const contenedor = document.getElementById('listaCuentas');
      let totalVenta = 0;
      let totalGanancia = 0;

      if(stock.length === 0) {
        contenedor.innerHTML = '<span style="font-size:0.8rem; color:var(--mac-text-muted);">Sin datos financieros automáticos (añade productos al stock).</span>';
        document.getElementById('totalVentaProyectada').innerText = '$0.00';
        document.getElementById('totalGananciaPotencial').innerText = '$0.00';
        return;
      }

      contenedor.innerHTML = stock.map(p => {
        const subtotalVenta = p.cantidad * p.precio;
        const subtotalGanancia = p.cantidad * (p.precio - p.costo);
        totalVenta += subtotalVenta;
        totalGanancia += subtotalGanancia;

        return `
          <div class="list-row" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
              <strong>${p.nombre}</strong>
              <span style="color:var(--mac-success); font-weight:600;">Ganancia: $${subtotalGanancia.toFixed(2)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; width: 100%; font-size: 0.75rem; color: var(--mac-text-muted);">
              <span>Cant: ${p.cantidad} | Venta u.: $${p.precio}</span>
              <span>Total Venta: $${subtotalVenta.toFixed(2)}</span>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('totalVentaProyectada').innerText = `$${totalVenta.toFixed(2)}`;
      document.getElementById('totalGananciaPotencial').innerText = `$${totalGanancia.toFixed(2)}`;
    }

    function renderizarTodo() {
      renderStock();
      renderClientes();
      renderCuentas();
    }

    renderizarTodo();
  </script>

</body>
</html>
