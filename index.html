<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro de Ventas</title>
  <style>
    :root {
      --primary-color: #007bff;
      --success-color: #28a745;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    h2, h3 {
      margin-top: 0;
      color: #1a1a1a;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    select, input {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--primary-color);
    }

    button {
      background-color: var(--success-color);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #218838;
    }

    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #e9ecef;
      font-size: 0.9rem;
    }

    th {
      background-color: var(--primary-color);
      color: white;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .badge-ganancia {
      color: var(--success-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- FORMULARIO DE REGISTRO DE VENTA -->
  <div class="card">
    <h2>Registrar Nueva Venta</h2>
    
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="vProducto">Producto / Combo</label>
        <select id="vProducto">
          <option value="">-- Seleccionar Producto --</option>
          <option value="cable_individual">Cable (Unidad) - $800</option>
          <option value="menta_individual">Menta (Unidad) - $2.000</option>
          <option value="combo_1">Combo 1 (1 Cable + 1 Menta) - $2.500</option>
          <option value="combo_2">Combo 2 (2 Cables + 1 Menta) - $3.000</option>
          <option value="combo_3">Combo 3 (2 Cables + 2 Mentas) - $4.500</option>
        </select>
      </div>

      <div class="form-group">
        <label for="vCantidad">Cantidad</label>
        <input type="number" id="vCantidad" value="1" min="1">
      </div>

      <div class="form-group">
        <label for="vUni">Unidad / Sede</label>
        <input type="text" id="vUni" placeholder="Ej: Local Central">
      </div>

      <div class="form-group full-width">
        <label for="vVendedor">Vendedor</label>
        <input type="text" id="vVendedor" placeholder="Nombre del vendedor">
      </div>
    </div>

    <button type="button" onclick="registrarVenta()">Registrar Venta</button>
  </div>

  <!-- TABLA DE HISTORIAL DE VENTAS -->
  <div class="card">
    <h3>Historial de Ventas</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Producto</th>
            <th>Cant</th>
            <th>Vendedor</th>
            <th>Total</th>
            <th>Ganancia</th>
          </tr>
        </thead>
        <tbody id="tablaVentas">
          <!-- Filas dinámicas creadas por JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Configuración inicial de variables globales
    let usuario = "Usuario_Sistema"; // Se puede sustituir por la sesión activa
    let db = null; // Si usas Firebase SDK, asigna aquí: firebase.firestore()
    let ventas = JSON.parse(localStorage.getItem('vnts')) || [];

    // Catálogo con la parametrización exacta acordada
    const productos = {
      'cable_individual': { 
        nombre: 'Cable (Unidad)', 
        precio: 800, 
        costo: 300, 
        valorComision: 100, 
        tipoComision: 'fijo' 
      },
      'menta_individual': { 
        nombre: 'Menta (Unidad)', 
        precio: 2000, 
        costo: 800, 
        valorComision: 200, 
        tipoComision: 'fijo' 
      },
      'combo_1': { 
        nombre: 'Combo 1 (1 Cable + 1 Menta)', 
        precio: 2500, 
        costo: 1100, 
        valorComision: 250, 
        tipoComision: 'fijo' 
      },
      'combo_2': { 
        nombre: 'Combo 2 (2 Cables + 1 Menta)', 
        precio: 3000, 
        costo: 1400, 
        valorComision: 300, 
        tipoComision: 'fijo' 
      },
      'combo_3': { 
        nombre: 'Combo 3 (2 Cables + 2 Mentas)', 
        precio: 4500, 
        costo: 2200, 
        valorComision: 450, 
        tipoComision: 'fijo' 
      }
    };

    // Renderizar la tabla de historial al cargar el DOM
    document.addEventListener("DOMContentLoaded", actualizarTabla);

    // Lógica principal de procesamiento
    async function registrarVenta() {
      const pId = document.getElementById('vProducto').value;
      const p = productos[pId];

      if (!p) {
        alert('Por favor, selecciona un producto o combo válido.');
        return;
      }

      const cant = parseInt(document.getElementById('vCantidad').value, 10) || 1;
      const uni = document.getElementById('vUni').value.trim() || 'General';
      const vendedor = document.getElementById('vVendedor').value.trim() || 'N/A';

      // Conversiones numéricas explícitas
      const precioVenta = Number(p.precio) || 0;
      const costoInsumo = Number(p.costo) || 0;
      const valComision = Number(p.valorComision) || 0;

      // Totales
      const totalVenta = precioVenta * cant;
      const totalCosto = costoInsumo * cant;
      let totalComision = 0;

      if (p.tipoComision === 'porcentaje') {
        const porcentaje = valComision > 1 ? valComision / 100 : valComision;
        totalComision = totalVenta * porcentaje;
      } else {
        totalComision = valComision * cant;
      }

      const gananciaNeta = totalVenta - totalCosto - totalComision;

      // Estructura del registro
      const reg = {
        fecha: new Date().toLocaleString([], { 
          year: 'numeric', 
          month: '2-digit', 
          day: '2-digit', 
          hour: '2-digit', 
          minute: '2-digit' 
        }),
        timestamp: Date.now(),
        usr: typeof usuario !== 'undefined' ? usuario : 'Anonimo',
        uni: uni,
        vendedor: vendedor,
        prod: p.nombre,
        cant: cant,
        total: totalVenta,
        com: totalComision,
        cos: totalCosto,
        gan: gananciaNeta
      };

      try {
        if (typeof db !== 'undefined' && db) {
          // Guardar asíncronamente en Firestore si la conexión existe
          await db.collection("ventas").add(reg);
        } else {
          // Guardar de forma local en el navegador (fallback)
          reg.id = 'local_' + Date.now();
          ventas.unshift(reg);
          localStorage.setItem('vnts', JSON.stringify(ventas));
          actualizarTabla();
        }

        alert(`Venta registrada con éxito:\n${cant}x ${p.nombre}\nTotal: $${totalVenta.toLocaleString()}`);
        limpiarFormulario();
      } catch (error) {
        console.error('Error al registrar la venta:', error);
        alert('Ocurrió un error al intentar guardar la venta.');
      }
    }

    // Renderizado dinámico de la tabla
    function actualizarTabla() {
      const tbody = document.getElementById('tablaVentas');
      tbody.innerHTML = '';

      if (ventas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No hay ventas registradas aún</td></tr>`;
        return;
      }

      ventas.forEach(v => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${v.fecha}</td>
          <td><strong>${v.prod}</strong></td>
          <td>${v.cant}</td>
          <td>${v.vendedor}</td>
          <td>$${v.total.toLocaleString()}</td>
          <td class="badge-ganancia">$${v.gan.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Limpieza de campos tras registro exitoso
    function limpiarFormulario() {
      document.getElementById('vProducto').value = '';
      document.getElementById('vCantidad').value = '1';
      document.getElementById('vUni').value = '';
      document.getElementById('vVendedor').value = '';
    }
  </script>
</body>
</html>
